owner: "isntfunny"
overview: "Anime opening/ending/recap skip times from AniSkip as media segments"
description: >
  Fetches crowd-sourced anime opening, ending and recap timestamps from the AniSkip
  database (api.aniskip.com) and publishes them through Jellyfin's Media Segments API,
  so any client with skip-segment support can skip them. AniDB/AniList ids on your
  anime are mapped to MyAnimeList ids via arm.haglund.dev. Fills the gap that audio
  fingerprinting cannot: recaps differ every episode and have no repeating audio, so
  only a crowd-sourced database can mark them.
category: "General"
artifacts:
  - "Jellyfin.Plugin.AniSkip.dll"
changelog: |-
  - Also query AniSkip for episodes with an unknown runtime (media not analyzed),
    using episodeLength 0, instead of skipping them.
  - Multi-cour support: map TheTVDB series id + season to the correct MAL entry
    via the Fribb anime-lists dataset (handles later seasons and split cours).
  - Initial release: op/ed/recap/mixed-op/mixed-ed as Intro/Outro/Recap segments.
